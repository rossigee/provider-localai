apiVersion: agent.localai.m.crossplane.io/v1beta1
kind: Agent
metadata:
  name: bookkeeping
  namespace: crossplane-system
spec:
  forProvider:
    name: bookkeeping
    model: qwen3-8b
    description: Bookkeeping via Odoo MCP only.
    instructions: |
      You keep the books. Use only the Odoo MCP tools.
    skills:
      - bookkeeping
    collections:
      - books
    mcpServers:
      - odoo
    network: off
  providerConfigRef:
    name: localai
