apiVersion: v1
kind: Secret
metadata:
  namespace: crossplane-system
  name: localai-provider-credentials
type: Opaque
stringData:
  # LocalAI only accepts API keys, not OIDC access tokens.
  token: "<LOCALAI_API_KEY>"
---
apiVersion: localai.m.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: localai
spec:
  baseURL: https://localai.example.com
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: localai-provider-credentials
      key: token
  # Optional: trust a private CA. The provider never skips verification.
  rootCACertificateRef:
    namespace: crossplane-system
    name: localai-ca
    key: ca.crt
