apiVersion: settings.localai.m.crossplane.io/v1beta1
kind: Settings
metadata:
  name: localai-runtime
  namespace: crossplane-system
spec:
  forProvider:
    # Posted to LocalAI's POST /api/settings. LocalAI merges these keys into its
    # saved settings. Keys not listed here are left unchanged.
    settings: |
      {"watchdog_idle_timeout": "15m", "threads": 8,
       "instance_name": "My LocalAI", "instance_tagline": "Fast local inference",
       "logo_file": "logo.png", "logo_horizontal_file": "logo_horizontal.svg",
       "favicon_file": "favicon.ico"}
  providerConfigRef:
    name: localai
