# Auto-Merge Workflow for Dependabot PRs
# Version: 2026-09-08 - Updated github-script to v9
#
# Implements severity-based auto-merge policy for Dependabot PRs:
# - Minor/patch updates for Go, GitHub Actions, Docker → auto-merge
# - Major updates, security updates, unclassified → block (human review)
#
# CI's govulncheck + gosec must pass before auto-merge proceeds.
# This workflow runs on pull_request_target so it can write to the PR.

name: Dependabot Auto-Merge

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - labeled
      # A PR opened as a draft is skipped by the `if` condition's policy checks
      # and never reconsidered. Promoting it to ready for review changes nothing
      # about the PR's risk, so without this event it sits unmerged until a
      # human merges it by hand.
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    # Keyed on the PR author, not github.actor. On opened and synchronize the
    # actor is dependabot, but on ready_for_review it is whoever promoted the
    # draft - so an actor check would skip exactly the event this was added for.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Determine Merge Strategy
        id: merge-strategy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const title = context.payload.pull_request.title;

            // Define auto-mergeable patterns (minor/patch only, never security or major)
            const autoMergeLabels = [
              'dependencies/go/minor',
              'dependencies/go/patch',
              'dependencies/github-actions/minor',
              'dependencies/github-actions/patch',
              'dependencies/docker/minor',
              'dependencies/docker/patch',
            ];

            const isAutoMergeable = autoMergeLabels.some(label => labels.includes(label));
            const isSecurity = labels.includes('dependencies/security') || labels.includes('security');
            const isMajor = labels.some(l => l.includes('/major')) || title.includes('!');

            if (isSecurity) {
              console.log('⛔ Security update — blocking, requires human review');
              return 'block';
            } else if (isMajor) {
              console.log('⛔ Major version update — blocking, requires human review');
              return 'block';
            } else if (isAutoMergeable) {
              console.log('✅ Minor/patch update — eligible for auto-merge');
              return 'automerge';
            } else {
              console.log('⛔ Unclassified or no matching label — blocking, requires human review');
              return 'block';
            }

      - name: Check CI Status
        if: steps.merge-strategy.outputs.result == 'automerge'
        id: ci-status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Every check run for the head commit, including those still running.
            // A required check that is missing or unfinished is pending, not passed.
            const checks = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: context.payload.pull_request.head.sha,
              per_page: 100,
            });

            // Required CI check names from ci.yml
            const requiredChecks = ['lint', 'check-diff', 'unit-tests', 'security-scan'];

            let state = 'passed';
            for (const check of requiredChecks) {
              const found = checks.find(c =>
                c.name.toLowerCase().includes(check.toLowerCase())
              );
              if (!found) {
                console.log(`  ${check}: not found, treating as pending`);
                if (state === 'passed') state = 'pending';
              } else if (found.status !== 'completed') {
                console.log(`  ${found.name}: ${found.status}, treating as pending`);
                if (state === 'passed') state = 'pending';
              } else {
                console.log(`  ${found.name}: ${found.conclusion}`);
                if (found.conclusion !== 'success') state = 'failed';
              }
            }

            if (state === 'failed') {
              console.log('❌ Required checks failed — blocking auto-merge');
            } else if (state === 'pending') {
              console.log('Required checks not finished yet, will re-check...');
            } else {
              console.log('✅ All required CI checks passed');
            }
            return state;

      - name: Wait for CI if Pending
        if: steps.ci-status.outputs.result == 'pending'
        run: |
          echo "Waiting for CI checks to complete..."
          sleep 60

      - name: Retry CI Status Check
        if: steps.ci-status.outputs.result == 'pending'
        id: ci-status-retry
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const checks = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: context.payload.pull_request.head.sha,
              per_page: 100,
            });

            const requiredChecks = ['lint', 'check-diff', 'unit-tests', 'security-scan'];
            let passed = true;

            for (const check of requiredChecks) {
              const found = checks.find(c =>
                c.name.toLowerCase().includes(check.toLowerCase())
              );
              if (!found || found.status !== 'completed' || found.conclusion !== 'success') {
                console.log(`  ${check}: not passing on retry`);
                passed = false;
              }
            }

            if (passed) {
              console.log('✅ All required CI checks passed');
              return 'passed';
            }
            console.log('❌ Required checks not all passing');
            return 'failed';

      - name: Enable Auto-Merge
        if: steps.ci-status-retry.outputs.result == 'passed' || steps.ci-status.outputs.result == 'passed'
        run: |
          echo "🔄 Enabling Dependabot auto-merge..."
          gh pr merge ${{ github.event.pull_request.number }} \
            --auto --squash \
            --delete-branch \
            --repo ${{ github.repository }}
          echo "✅ Auto-merge enabled for PR #${{ github.event.pull_request.number }}"

      - name: Notify Blocked PR
        if: steps.merge-strategy.outputs.result == 'block'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ', ') }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "⛔ PR #${{ github.event.pull_request.number }} requires human review"
          echo "   Title: $PR_TITLE"
          echo "   Labels: $PR_LABELS"
          echo "   Author: $PR_AUTHOR"
